<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waymo Segment Viewer</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --control: #f0efec;
    --vehicle: #2a78d6;
    --pedestrian: #eb6834;
    --cyclist: #1baf7a;
    --sign: #898781;
    --ego: #0b0b0b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --control: #2c2c2a;
      --vehicle: #3987e5;
      --pedestrian: #d95926;
      --cyclist: #199e70;
      --ego: #f0efec;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --control: #2c2c2a;
    --vehicle: #3987e5;
    --pedestrian: #d95926;
    --cyclist: #199e70;
    --ego: #f0efec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .controls select, .controls button {
    font: inherit; color: var(--text-primary); background: var(--control);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px;
  }
  .controls button { min-width: 72px; cursor: pointer; }
  #scrub { flex: 1 1 240px; min-width: 160px; accent-color: var(--vehicle); }
  .time { font-variant-numeric: tabular-nums; color: var(--text-secondary); min-width: 128px; }
  .status { color: var(--muted); font-size: 12px; }
  .summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px; background: var(--border); overflow: hidden; margin-bottom: 12px;
  }
  .stat { background: var(--surface); padding: 10px 12px; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 18px; font-weight: 600; }
  .stat .sub { color: var(--text-secondary); font-size: 12px; }
  .sensors {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;
  }
  .cell { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
  .cell img { width: 100%; display: block; }
  .cell .tag {
    position: absolute; left: 6px; top: 6px; font-size: 11px; padding: 2px 6px;
    border-radius: 4px; background: rgba(0, 0, 0, 0.6); color: #f0efec; letter-spacing: 0.02em;
  }
  .cell.bev { background: var(--surface); aspect-ratio: 1; }
  .cell.bev canvas { width: 100%; height: 100%; display: block; }
  .cell.bev .tag { background: var(--control); color: var(--text-secondary); }
  .bev-legend {
    position: absolute; right: 6px; top: 6px; display: flex; flex-direction: column; gap: 2px;
    font-size: 11px; color: var(--text-secondary); background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px;
  }
  .bev-legend span { display: flex; align-items: center; gap: 6px; }
  .bev-legend svg { flex: none; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .chart { padding: 10px 12px 6px; position: relative; }
  .chart h2 { font-size: 13px; font-weight: 600; margin: 0; }
  .chart .note { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); margin: 2px 0 4px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
  .chart svg { display: block; width: 100%; overflow: visible; cursor: crosshair; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--surface); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); white-space: nowrap; display: none; z-index: 2;
  }
  .tooltip .row { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .tooltip .row i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tooltip .head { color: var(--text-secondary); margin-bottom: 2px; }
  details { padding: 10px 12px; }
  summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .table-wrap { max-height: 320px; overflow: auto; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); }
  th { position: sticky; top: 0; background: var(--surface); color: var(--text-secondary); font-weight: 600; }
  tr.current td { background: var(--control); }
  tbody tr { cursor: pointer; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (max-width: 760px) {
    .sensors { grid-template-columns: 1fr 1fr; }
    .cell.bev { grid-column: 1 / -1; order: -1; }
  }
</style>
</head>
<body>
<main>
  <h1>Waymo Segment Viewer</h1>

  <div class="card controls">
    <select id="segment" aria-label="Segment"></select>
    <button id="play" type="button">Play</button>
    <select id="rate" aria-label="Playback speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Frame">
    <span class="time" id="time">–</span>
    <select id="extent" aria-label="Bird's-eye range">
      <option value="30">BEV ±30 m</option>
      <option value="50" selected>BEV ±50 m</option>
      <option value="75">BEV ±75 m</option>
    </select>
    <span class="status" id="status"></span>
  </div>

  <div class="card summary" id="summary"></div>

  <div class="sensors">
    <div class="cell"><img id="cam-FRONT_LEFT" alt="Front-left camera"><span class="tag">FRONT_LEFT</span></div>
    <div class="cell"><img id="cam-FRONT" alt="Front camera"><span class="tag">FRONT</span></div>
    <div class="cell"><img id="cam-FRONT_RIGHT" alt="Front-right camera"><span class="tag">FRONT_RIGHT</span></div>
    <div class="cell"><img id="cam-SIDE_LEFT" alt="Side-left camera"><span class="tag">SIDE_LEFT</span></div>
    <div class="cell card bev">
      <canvas id="bev" aria-label="Bird's-eye view of labeled objects"></canvas>
      <span class="tag">BIRD'S-EYE VIEW · forward is up</span>
      <div class="bev-legend" id="bev-legend"></div>
    </div>
    <div class="cell"><img id="cam-SIDE_RIGHT" alt="Side-right camera"><span class="tag">SIDE_RIGHT</span></div>
  </div>

  <div class="charts">
    <div class="card chart" id="chart-speed"></div>
    <div class="card chart" id="chart-counts"></div>
    <div class="card chart" id="chart-nearest"></div>
  </div>

  <div class="card">
    <details id="table-details">
      <summary>Per-frame table</summary>
      <div class="table-wrap"><table id="table"></table></div>
    </details>
  </div>
  <p class="hint">Space plays or pauses. Left and right arrows step one frame. Click a chart or a table row to jump to that frame.</p>
</main>

<script>
const MPS_TO_MPH = 2.23694;
const TYPE_KEYS = ["VEHICLE", "PEDESTRIAN", "CYCLIST", "SIGN"];
const TYPE_LABEL = { VEHICLE: "Vehicles", PEDESTRIAN: "Pedestrians", CYCLIST: "Cyclists", SIGN: "Signs" };
const TYPE_VAR = { VEHICLE: "--vehicle", PEDESTRIAN: "--pedestrian", CYCLIST: "--cyclist", SIGN: "--sign" };
const LOCATION = { location_phx: "Phoenix", location_sf: "San Francisco", location_other: "Other" };

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const state = { meta: null, frame: 0, playing: false, images: {}, charts: [], lastTick: 0, carry: 0 };

// ---------- loading ----------

async function init() {
  const index = await (await fetch("data/index.json")).json();
  for (const seg of index) {
    const option = document.createElement("option");
    option.value = seg.key;
    option.textContent = `${LOCATION[seg.location] || seg.location} · ${seg.key.split("_")[0].slice(0, 8)}… · ${seg.frames} frames`;
    $("segment").append(option);
  }
  $("segment").addEventListener("change", () => loadSegment($("segment").value));
  await loadSegment(index[0].key);
}

async function loadSegment(key) {
  pause();
  state.meta = await (await fetch(`data/${key}/meta.json`)).json();
  state.frame = 0;
  $("scrub").max = state.meta.frames.length - 1;
  preloadImages();
  renderSummary();
  buildCharts();
  buildTable();
  renderBevLegend();
  showFrame(0);
}

function imageUrl(camera, index) {
  return `data/${state.meta.key}/cam/${camera}/${String(index).padStart(3, "0")}.jpg`;
}

function preloadImages() {
  const { meta } = state;
  const total = meta.frames.length * meta.cameras.length;
  let done = 0;
  state.images = {};
  const update = () => {
    $("status").textContent = done < total ? `Loading frames ${done}/${total}` : "";
  };
  update();
  for (const camera of meta.cameras) {
    state.images[camera] = meta.frames.map((_, i) => {
      const img = new Image();
      img.onload = img.onerror = () => { done++; if (done % 25 === 0 || done === total) update(); };
      img.src = imageUrl(camera, i);
      return img;
    });
  }
}

// ---------- summary ----------

function renderSummary() {
  const s = state.meta.summary;
  const mph = (v) => (v * MPS_TO_MPH).toFixed(1);
  const stats = [
    ["Location", LOCATION[s.location] || s.location, `${s.time_of_day} · ${s.weather}`],
    ["Duration", `${s.duration_s.toFixed(1)} s`, `${s.frames} frames at 10 Hz`],
    ["Mean speed", `${mph(s.mean_speed_mps)} mph`, `${s.mean_speed_mps.toFixed(1)} m/s`],
    ["Max speed", `${mph(s.max_speed_mps)} mph`, `${s.max_speed_mps.toFixed(1)} m/s`],
    ...TYPE_KEYS.map((t) => [`${TYPE_LABEL[t]} tracked`, String(s.tracked_objects[t]), "unique objects"]),
  ];
  $("summary").innerHTML = stats.map(([label, value, sub]) =>
    `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`
  ).join("");
}

// ---------- frame display ----------

function showFrame(index) {
  const { meta } = state;
  state.frame = Math.max(0, Math.min(meta.frames.length - 1, index));
  const f = meta.frames[state.frame];
  for (const camera of meta.cameras) $(`cam-${camera}`).src = imageUrl(camera, state.frame);
  $("scrub").value = state.frame;
  $("time").textContent = `${f.t.toFixed(1)} s · frame ${state.frame}/${meta.frames.length - 1}`;
  drawBev(f);
  for (const chart of state.charts) chart.setCursor(state.frame);
  highlightRow(state.frame);
}

// ---------- bird's-eye view ----------

function shapeIcon(type, color) {
  if (type === "PEDESTRIAN") return `<svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="${color}"/></svg>`;
  if (type === "SIGN") return `<svg width="10" height="10"><path d="M5 1 9 5 5 9 1 5Z" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
  if (type === "CYCLIST") return `<svg width="10" height="10"><rect x="1" y="3" width="8" height="4" rx="1" fill="${color}"/></svg>`;
  return `<svg width="10" height="10"><rect x="1" y="2" width="8" height="6" rx="1" fill="${color}"/></svg>`;
}

function renderBevLegend() {
  const present = TYPE_KEYS.filter((t) => state.meta.summary.tracked_objects[t] > 0);
  $("bev-legend").innerHTML = present.map((t) =>
    `<span>${shapeIcon(t, css(TYPE_VAR[t]))}${TYPE_LABEL[t]}</span>`).join("");
}

function drawBev(f) {
  const canvas = $("bev");
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;
  if (!size) return;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const extent = Number($("extent").value);
  const scale = size / (2 * extent);
  const c = size / 2;
  // vehicle frame: x forward -> screen up, y left -> screen left
  const toScreen = (x, y) => [c - y * scale, c - x * scale];

  ctx.fillStyle = css("--surface");
  ctx.fillRect(0, 0, size, size);

  // range rings
  ctx.strokeStyle = css("--grid");
  ctx.fillStyle = css("--muted");
  ctx.lineWidth = 1;
  ctx.font = "11px system-ui, sans-serif";
  const rings = extent <= 30 ? [10, 20, 30] : extent <= 50 ? [10, 25, 50] : [25, 50, 75];
  for (const r of rings) {
    ctx.beginPath();
    ctx.arc(c, c, r * scale, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillText(`${r} m`, c + 4, c + r * scale - 4);
  }
  ctx.beginPath();
  ctx.moveTo(c, 0); ctx.lineTo(c, size); ctx.moveTo(0, c); ctx.lineTo(size, c);
  ctx.stroke();

  const colors = Object.fromEntries(TYPE_KEYS.map((t) => [t, css(TYPE_VAR[t])]));
  const surface = css("--surface");

  // signs first so traffic sits on top
  const order = [3, 0, 2, 1];
  for (const typeIndex of order) {
    const type = TYPE_KEYS[typeIndex];
    for (const [ti, x, y, length, width, heading] of f.boxes) {
      if (ti !== typeIndex) continue;
      const [sx, sy] = toScreen(x, y);
      ctx.strokeStyle = colors[type];
      ctx.fillStyle = colors[type];
      if (type === "SIGN") {
        const r = 4;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sx, sy - r); ctx.lineTo(sx + r, sy); ctx.lineTo(sx, sy + r); ctx.lineTo(sx - r, sy);
        ctx.closePath();
        ctx.stroke();
      } else if (type === "PEDESTRIAN") {
        ctx.beginPath();
        ctx.arc(sx, sy, Math.max(3.5, (Math.max(length, width) / 2) * scale), 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = surface;
        ctx.stroke();
      } else {
        const cos = Math.cos(heading), sin = Math.sin(heading);
        const hl = length / 2, hw = width / 2;
        const corners = [[hl, hw], [hl, -hw], [-hl, -hw], [-hl, hw]].map(([dx, dy]) =>
          toScreen(x + dx * cos - dy * sin, y + dx * sin + dy * cos));
        ctx.beginPath();
        corners.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
        ctx.closePath();
        ctx.globalAlpha = 0.55;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // heading tick from center to front edge
        const [fx, fy] = toScreen(x + hl * cos, y + hl * sin);
        ctx.beginPath();
        ctx.moveTo(sx, sy); ctx.lineTo(fx, fy);
        ctx.stroke();
      }
    }
  }

  // ego vehicle (approximate footprint)
  const ego = [[2.4, 1.05], [2.4, -1.05], [-2.4, -1.05], [-2.4, 1.05]].map(([x, y]) => toScreen(x, y));
  ctx.fillStyle = css("--ego");
  ctx.beginPath();
  ego.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
  ctx.closePath();
  ctx.fill();
}

// ---------- line charts ----------

function niceStep(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function lineChart(container, { title, note, series, format, unit }) {
  const frames = state.meta.frames;
  const t = frames.map((f) => f.t);
  const tMax = t[t.length - 1];
  const dataMax = Math.max(...series.flatMap((s) => s.values.filter((v) => v != null)));
  const yStep = niceStep((dataMax * 1.05) / 4);
  const yTicks = Math.max(1, Math.ceil((dataMax * 1.05) / yStep));
  const yMax = yStep * yTicks;
  const multi = series.length > 1;

  container.innerHTML = `<h2>${title}</h2><p class="note">${note}</p>` +
    (multi ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>` : "") +
    `<div class="tooltip"></div>`;
  const tooltip = container.querySelector(".tooltip");
  const W = Math.max(280, container.clientWidth - 24);
  const H = 170;
  const m = { top: 8, right: multi ? 82 : 12, bottom: 22, left: 36 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const x = (v) => m.left + (v / tMax) * iw;
  const y = (v) => m.top + ih - (v / yMax) * ih;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", title);
  const add = (tag, attrs, parent = svg) => {
    const el = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    parent.append(el);
    return el;
  };

  // grid and axes
  for (let i = 0; i <= yTicks; i++) {
    const v = yStep * i;
    add("line", { x1: m.left, x2: m.left + iw, y1: y(v), y2: y(v), stroke: i ? css("--grid") : css("--axis"), "stroke-width": 1 });
    const label = add("text", { x: m.left - 6, y: y(v) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted"), "font-variant-numeric": "tabular-nums" });
    label.textContent = Number.isInteger(v) ? v : v.toFixed(1);
  }
  for (let s = 0; s <= tMax + 0.01; s += 5) {
    const label = add("text", { x: x(s), y: H - 6, "text-anchor": "middle", "font-size": 11, fill: css("--muted") });
    label.textContent = `${s}s`;
  }

  // series lines (gaps where a value is missing)
  for (const s of series) {
    let d = "", pen = false;
    s.values.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(t[i]).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    add("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
  }

  // direct labels at the last value, nudged apart
  if (multi) {
    const ends = series.map((s) => {
      let i = s.values.length - 1;
      while (i > 0 && s.values[i] == null) i--;
      return { s, py: s.values[i] == null ? null : y(s.values[i]) };
    }).filter((e) => e.py != null).sort((a, b) => a.py - b.py);
    for (let i = 1; i < ends.length; i++) ends[i].py = Math.max(ends[i].py, ends[i - 1].py + 13);
    for (const e of ends) {
      const label = add("text", { x: m.left + iw + 6, y: e.py + 4, "font-size": 11, fill: css("--text-secondary") });
      label.textContent = e.s.name;
    }
  }

  // current-frame cursor and hover crosshair
  const cursor = add("line", { y1: m.top, y2: m.top + ih, stroke: css("--text-secondary"), "stroke-width": 1.5 });
  const hover = add("line", { y1: m.top, y2: m.top + ih, stroke: css("--muted"), "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" });
  const dots = series.map((s) => add("circle", { r: 4, fill: s.color, stroke: css("--surface"), "stroke-width": 2, visibility: "hidden" }));
  const hit = add("rect", { x: m.left, y: m.top, width: iw, height: ih, fill: "transparent" });
  container.append(svg);

  const frameAt = (evt) => {
    const rect = svg.getBoundingClientRect();
    const px = ((evt.clientX - rect.left) / rect.width) * W;
    const tv = ((px - m.left) / iw) * tMax;
    let best = 0;
    for (let i = 1; i < t.length; i++) if (Math.abs(t[i] - tv) < Math.abs(t[best] - tv)) best = i;
    return best;
  };
  hit.addEventListener("mousemove", (evt) => {
    const i = frameAt(evt);
    hover.setAttribute("x1", x(t[i])); hover.setAttribute("x2", x(t[i]));
    hover.setAttribute("visibility", "visible");
    series.forEach((s, k) => {
      const v = s.values[i];
      dots[k].setAttribute("visibility", v == null ? "hidden" : "visible");
      if (v != null) { dots[k].setAttribute("cx", x(t[i])); dots[k].setAttribute("cy", y(v)); }
    });
    tooltip.innerHTML = `<div class="head">${t[i].toFixed(1)} s · frame ${i}</div>` +
      series.map((s) => `<div class="row"><i style="background:${s.color}"></i>${multi ? s.name + ": " : ""}${s.values[i] == null ? "none" : format(s.values[i], i)}</div>`).join("");
    tooltip.style.display = "block";
    const rect = svg.getBoundingClientRect(), crect = container.getBoundingClientRect();
    const left = evt.clientX - crect.left + 12;
    tooltip.style.left = `${Math.min(left, crect.width - tooltip.offsetWidth - 4)}px`;
    tooltip.style.top = `${rect.top - crect.top + 8}px`;
  });
  hit.addEventListener("mouseleave", () => {
    hover.setAttribute("visibility", "hidden");
    dots.forEach((d) => d.setAttribute("visibility", "hidden"));
    tooltip.style.display = "none";
  });
  hit.addEventListener("click", (evt) => { pause(); showFrame(frameAt(evt)); });

  return {
    setCursor(i) { cursor.setAttribute("x1", x(t[i])); cursor.setAttribute("x2", x(t[i])); },
  };
}

function buildCharts() {
  const frames = state.meta.frames;
  const present = TYPE_KEYS.filter((k) => state.meta.summary.tracked_objects[k] > 0);
  state.charts = [
    lineChart($("chart-speed"), {
      title: "Ego speed",
      note: "mph, from the vehicle's pose in each frame",
      series: [{ name: "Speed", color: css("--vehicle"), values: frames.map((f) => f.speed * MPS_TO_MPH) }],
      format: (v, i) => `${v.toFixed(1)} mph (${frames[i].speed.toFixed(1)} m/s)`,
    }),
    lineChart($("chart-counts"), {
      title: "Labeled objects per frame",
      note: "3D labels visible in each frame",
      series: present.map((k) => ({ name: TYPE_LABEL[k], color: css(TYPE_VAR[k]), values: frames.map((f) => f.counts[k]) })),
      format: (v) => String(v),
    }),
    lineChart($("chart-nearest"), {
      title: "Nearest object",
      note: "meters, center-to-center from the car's reference point",
      series: [
        { name: "Vehicle", color: css("--vehicle"), values: frames.map((f) => f.nearest.VEHICLE) },
        { name: "Pedestrian", color: css("--pedestrian"), values: frames.map((f) => f.nearest.PEDESTRIAN) },
      ],
      format: (v) => `${v.toFixed(1)} m`,
    }),
  ];
}

// ---------- table ----------

function buildTable() {
  const fmt = (v, d = 1) => (v == null ? "–" : v.toFixed(d));
  const rows = state.meta.frames.map((f, i) =>
    `<tr data-i="${i}"><td>${i}</td><td>${f.t.toFixed(1)}</td><td>${fmt(f.speed * MPS_TO_MPH)}</td>` +
    TYPE_KEYS.map((k) => `<td>${f.counts[k]}</td>`).join("") +
    `<td>${fmt(f.nearest.VEHICLE)}</td><td>${fmt(f.nearest.PEDESTRIAN)}</td></tr>`).join("");
  $("table").innerHTML = `<thead><tr><th>Frame</th><th>Time (s)</th><th>Speed (mph)</th>` +
    TYPE_KEYS.map((k) => `<th>${TYPE_LABEL[k]}</th>`).join("") +
    `<th>Nearest vehicle (m)</th><th>Nearest pedestrian (m)</th></tr></thead><tbody>${rows}</tbody>`;
  $("table").querySelector("tbody").addEventListener("click", (evt) => {
    const row = evt.target.closest("tr");
    if (row) { pause(); showFrame(Number(row.dataset.i)); }
  });
}

function highlightRow(i) {
  const tbody = $("table").querySelector("tbody");
  if (!tbody) return;
  tbody.querySelector("tr.current")?.classList.remove("current");
  const row = tbody.children[i];
  if (!row) return;
  row.classList.add("current");
  if ($("table-details").open && state.playing) row.scrollIntoView({ block: "nearest" });
}

// ---------- playback ----------

function play() {
  if (state.frame >= state.meta.frames.length - 1) showFrame(0);
  state.playing = true;
  $("play").textContent = "Pause";
  state.lastTick = performance.now();
  state.carry = 0;
  requestAnimationFrame(tick);
}

function pause() {
  state.playing = false;
  $("play").textContent = "Play";
}

function tick(now) {
  if (!state.playing) return;
  const frames = state.meta.frames;
  state.carry += ((now - state.lastTick) / 1000) * Number($("rate").value);
  state.lastTick = now;
  let i = state.frame;
  while (i < frames.length - 1 && state.carry >= frames[i + 1].t - frames[i].t) {
    state.carry -= frames[i + 1].t - frames[i].t;
    i++;
  }
  if (i !== state.frame) showFrame(i);
  if (i >= frames.length - 1) { pause(); return; }
  requestAnimationFrame(tick);
}

$("play").addEventListener("click", () => (state.playing ? pause() : play()));
$("scrub").addEventListener("input", () => { pause(); showFrame(Number($("scrub").value)); });
$("extent").addEventListener("change", () => showFrame(state.frame));
document.addEventListener("keydown", (evt) => {
  if (evt.target.tagName === "SELECT" || evt.target.tagName === "INPUT") return;
  if (evt.code === "Space") { evt.preventDefault(); state.playing ? pause() : play(); }
  else if (evt.key === "ArrowRight") { pause(); showFrame(state.frame + 1); }
  else if (evt.key === "ArrowLeft") { pause(); showFrame(state.frame - 1); }
});
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state.meta) { buildCharts(); showFrame(state.frame); } }, 150);
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (state.meta) { renderBevLegend(); buildCharts(); showFrame(state.frame); }
});

init().catch((err) => {
  $("status").textContent = `Could not load data: ${err.message}. Run tools/export_viewer.py first.`;
});
</script>
</body>
</html>
